<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090c10">
  <title>AI UNIVERSAL SIGNAL RADAR - PRECISION 1M</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100%;background:#090c10;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,monospace}
    body{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:0;overflow:hidden}
    .radar-card{width:100%;max-width:390px;height:100svh;max-height:650px;min-height:500px;background:#0d1117;border:1px solid #30363d;border-radius:16px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;box-shadow:0 16px 36px #000d}
    .top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .brand-title{font-size:13px;font-weight:800;color:#58a6ff;letter-spacing:1px}
    .power-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid #ff7b72;background:#f8514926;color:#ff7b72}
    .power-btn.active{border-color:#3fb950;background:#2ea04326;color:#3fb950}
    .api-monitor{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#161b22;padding:9px 12px;border-radius:10px;border:1px solid #21262d;margin-top:6px}
    .api-info{font-size:11px;color:#8b949e;font-weight:700}
    .api-status-badge{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:#ff7b72}
    .api-status-badge.online{color:#3fb950}
    .status-dot{width:8px;height:8px;border-radius:50%;background:#ff7b72;flex:none}
    .status-dot.online{background:#3fb950;box-shadow:0 0 10px #3fb950;animation:blink 1s infinite alternate}
    @keyframes blink{to{opacity:.35}}
    .radar-center-view{position:relative;width:170px;height:170px;display:flex;justify-content:center;align-items:center}
    .radar-ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
    .ring-bg{fill:none;stroke:#161b22;stroke-width:6}
    .ring-pulse{fill:none;stroke:#ff7b72;stroke-width:6;stroke-dasharray:50 170;stroke-linecap:round;opacity:.5}
    .ring-pulse.active{stroke:#3fb950;opacity:1;animation:spin 1.4s linear infinite}
    @keyframes spin{to{stroke-dashoffset:-220}}
    .center-status-text{position:absolute;text-align:center;width:80%;font-size:12px;font-weight:800;color:#ff7b72;text-transform:uppercase;overflow-wrap:anywhere}
    .center-status-text.active{color:#58a6ff}
    .order-signal-box{width:100%;background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .signal-direction{display:flex;flex-direction:column;align-items:flex-start}
    .signal-label,.timer-label{font-size:10px;color:#8b949e;font-weight:700;text-transform:uppercase}
    .signal-val{font-size:24px;font-weight:900;letter-spacing:2px;color:#ff7b72}
    .signal-val.call{color:#3fb950;text-shadow:0 0 12px #3fb95066}
    .signal-val.put{color:#ff7b72;text-shadow:0 0 12px #ff7b7266}
    .timer-side{display:flex;flex-direction:column;align-items:flex-end}
    .timer-clock{font-size:20px;font-weight:800;color:#f0f6fc;font-family:monospace}
    .footer-note{font-size:10px;color:#687385;text-align:center;font-weight:600;line-height:1.5;max-width:100%}
    @media(max-height:560px){.radar-card{min-height:0;padding:12px}.radar-center-view{width:135px;height:135px}.order-signal-box{padding:11px}}
  </style>
</head>
<body>
  <main class="radar-card">
    <div class="top-bar">
      <div class="brand-title">● PRECISION RADAR 1M</div>
      <button class="power-btn" id="powerBtn" type="button" aria-pressed="false">
        <span id="powerIcon">⭕</span><span id="powerTxt">SYSTEM OFF</span>
      </button>
    </div>
    <div class="api-monitor">
      <div class="api-info">PAIR: EUR/USD (M1)</div>
      <div class="api-status-badge" id="apiBadge"><span class="status-dot" id="apiDot"></span><span id="apiStatusTxt">DISCONNECTED</span></div>
    </div>
    <div class="radar-center-view">
      <svg class="radar-ring-svg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="38"></circle>
        <circle class="ring-pulse" id="radarRing" cx="50" cy="50" r="38"></circle>
      </svg>
      <div class="center-status-text" id="centerMsg">กดเริ่มเพื่อเชื่อมต่อ API</div>
    </div>
    <div class="order-signal-box">
      <div class="signal-direction">
        <div class="signal-label">1-CANDLE SIGNAL</div>
        <div class="signal-val" id="signalVal">STANDBY</div>
      </div>
      <div class="timer-side">
        <div class="timer-label">M1 COUNTDOWN</div>
        <div class="timer-clock" id="timerClock">01:00</div>
      </div>
    </div>
    <div class="footer-note" id="footerNote">Twelve Data · EUR/USD · Manual decision support only</div>
  </main>
<script>
(() => {
  'use strict';
  const POLL_MS = 5000;
  const SIGNAL_HOLD_SECONDS = 40;
  let isPowerOn = false;
  let pollTimer = null;
  let audioCtx = null;
  let activeSignal = 'STANDBY';
  let signalStartedAt = 0;
  let lastAlertKey = '';
  let lastTenAlert = '';
  let lastThreeAlert = '';
  let lastCandle = '';
  const $ = id => document.getElementById(id);

  function setApi(status, message) {
    $('apiBadge').classList.toggle('online', status === 'connected');
    $('apiDot').classList.toggle('online', status === 'connected');
    const labels = {
      connected: 'LIVE API · CONNECTED',
      connecting: 'CONNECTING',
      quota_exhausted: 'API QUOTA EXHAUSTED',
      error: 'API ERROR',
      off: 'DISCONNECTED'
    };
    $('apiStatusTxt').textContent = labels[status] || 'DISCONNECTED';
    $('apiBadge').title = message || '';
  }
  function renderSignal(signal, detail) {
    const valid = ['CALL','PUT','STANDBY'].includes(signal) ? signal : 'STANDBY';
    $('signalVal').textContent = valid;
    $('signalVal').className = 'signal-val' + (valid === 'STANDBY' ? '' : ' ' + valid.toLowerCase());
    $('centerMsg').textContent = detail || (valid === 'STANDBY' ? 'WAITING FOR MARKET DATA' : 'SIGNAL CONFIRMED');
    $('centerMsg').classList.toggle('active', isPowerOn);
  }
  function startAudio() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }
  function beep(freq, duration) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.08;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration / 1000);
    } catch (_) {}
  }
  function alertSignal(signal, candle) {
    const key = candle + ':' + signal;
    if (key === lastAlertKey) return;
    lastAlertKey = key;
    beep(signal === 'CALL' ? 587.33 : 220, 220);
    if (navigator.vibrate) { try { navigator.vibrate([180,80,180]); } catch (_) {} }
  }
  async function fetchSignal() {
    if (!isPowerOn) return;
    try {
      const response = await fetch('/api/signal', { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const apiStatus = data.apiStatus || 'error';
      setApi(apiStatus, data.apiMessage || data.reason || '');
      if (data.price !== undefined && data.price !== null) $('footerNote').textContent = 'EUR/USD: ' + data.price + ' · ' + (data.datetime || 'LIVE DATA');
      if (apiStatus !== 'connected') {
        activeSignal = 'STANDBY';
        signalStartedAt = 0;
        renderSignal('STANDBY', data.apiMessage || 'API UNAVAILABLE');
        return;
      }
      const candle = String(data.datetime || '');
      if (!candle) {
        activeSignal = 'STANDBY';
        renderSignal('STANDBY', 'CANDLE TIMESTAMP MISSING');
        return;
      }
      if (candle !== lastCandle) {
        lastCandle = candle;
        activeSignal = 'STANDBY';
        signalStartedAt = 0;
      }
      const incoming = ['CALL','PUT','STANDBY'].includes(data.signal) ? data.signal : 'STANDBY';
      if (incoming === 'CALL' || incoming === 'PUT') {
        if (activeSignal !== incoming) {
          activeSignal = incoming;
          signalStartedAt = Date.now();
          alertSignal(incoming, candle);
        }
        renderSignal(incoming, incoming === 'CALL' ? 'BULLISH · API CONFIRMED' : 'BEARISH · API CONFIRMED');
      } else {
        activeSignal = 'STANDBY';
        signalStartedAt = 0;
        renderSignal('STANDBY', 'WAITING FOR CLEAR SIGNAL');
      }
      $('footerNote').textContent = (data.reason || 'Twelve Data · EUR/USD') + ' · Manual only';
    } catch (error) {
      setApi('error', error.message);
      activeSignal = 'STANDBY';
      signalStartedAt = 0;
      renderSignal('STANDBY', 'API CONNECTION ERROR');
      $('footerNote').textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ · กำลังลองใหม่';
    }
  }
  function toggleSystemPower() {
    isPowerOn = !isPowerOn;
    $('powerBtn').classList.toggle('active', isPowerOn);
    $('powerBtn').setAttribute('aria-pressed', String(isPowerOn));
    $('powerTxt').textContent = isPowerOn ? 'SYSTEM ON' : 'SYSTEM OFF';
    $('powerIcon').textContent = isPowerOn ? '⚡' : '⭕';
    $('radarRing').classList.toggle('active', isPowerOn);
    if (isPowerOn) {
      startAudio();
      setApi('connecting');
      renderSignal('STANDBY', 'CONNECTING TO MARKET API');
      $('footerNote').textContent = 'กำลังขอข้อมูล EUR/USD จากเซิร์ฟเวอร์';
      fetchSignal();
      pollTimer = setInterval(fetchSignal, POLL_MS);
    } else {
      clearInterval(pollTimer);
      pollTimer = null;
      setApi('off');
      activeSignal = 'STANDBY';
      signalStartedAt = 0;
      renderSignal('STANDBY', 'SCANNER STOPPED');
      $('footerNote').textContent = 'หยุดสแกนแล้ว · Manual decision support only';
    }
  }
  function updateTimer() {
    const now = new Date();
    const remaining = 60 - now.getSeconds();
    $('timerClock').textContent = '00:' + String(remaining).padStart(2,'0');
    if (!isPowerOn) return;
    const candleKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate() + '-' + now.getHours() + '-' + now.getMinutes();
    if (remaining === 10 && lastTenAlert !== candleKey) {
      beep(440, 130); lastTenAlert = candleKey;
    }
    if (remaining <= 3 && remaining > 0 && lastThreeAlert !== candleKey + ':' + remaining) {
      beep(660, 100); lastThreeAlert = candleKey + ':' + remaining;
    }
    if (activeSignal !== 'STANDBY' && signalStartedAt) {
      const left = Math.max(0, Math.ceil(SIGNAL_HOLD_SECONDS - (Date.now() - signalStartedAt) / 1000));
      if (left === 0) {
        activeSignal = 'STANDBY';
        signalStartedAt = 0;
        renderSignal('STANDBY', 'SIGNAL EXPIRED · WAITING');
      }
    }
  }
  $('powerBtn').addEventListener('click', toggleSystemPower);
  setApi('off');
  renderSignal('STANDBY', 'กดเริ่มเพื่อเชื่อมต่อ API');
  updateTimer();
  setInterval(updateTimer, 250);
})();
</script>
</body>
</html>
