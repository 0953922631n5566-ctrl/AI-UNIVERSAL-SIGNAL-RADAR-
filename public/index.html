<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#090d14">
<title>AI Universal Signal Radar · Connection</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090d14;color:#e8eef8;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:18px}.panel{width:min(100%,430px);border:1px solid #26364b;border-radius:20px;padding:22px;background:#111a27;box-shadow:0 18px 60px #0008}.brand{font-size:13px;font-weight:900;letter-spacing:1.3px}.sub{font-size:11px;color:#8fa3bc;margin-top:5px}.lamp{width:12px;height:12px;border-radius:50%;background:#8995a5;display:inline-block;margin-right:9px}.lamp.on{background:#31d69a;box-shadow:0 0 14px #31d69a88}.status{margin-top:24px;padding:16px;border:1px solid #293c54;border-radius:14px;background:#0c1420}.line{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #233247;font-size:13px}.line:last-child{border:0}.value{font-weight:800}.good{color:#31d69a}.warn{color:#ffca72}.muted{color:#8fa3bc;font-size:11px;margin-top:18px;line-height:1.6}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:18px;background:#176fc2;color:white;font-weight:800;font-size:13px}
</style>
</head>
<body>
<main class="panel">
  <div class="brand">◈ AI UNIVERSAL SIGNAL RADAR</div>
  <div class="sub">CONNECTION SERVICE · TELEGRAM NOTIFICATION</div>
  <section class="status">
    <div class="line"><span><i id="serverLamp" class="lamp"></i>Server</span><b id="serverState" class="value">Checking…</b></div>
    <div class="line"><span><i id="telegramLamp" class="lamp"></i>Telegram Bot</span><b id="telegramState" class="value">Checking…</b></div>
    <div class="line"><span>Notification Gateway</span><b id="gatewayState" class="value">Checking…</b></div>
  </section>
  <div id="message" class="muted">หน้านี้แสดงเฉพาะสถานะการเชื่อมต่อและ Telegram Notification ไม่มี OCR ไม่มีการจับภาพ ไม่มีระบบอ่านหรือวิเคราะห์ราคา</div>
  <button id="refresh">ตรวจสอบการเชื่อมต่อ</button>
</main>
<script>
const $=id=>document.getElementById(id);
async function refresh(){
  $('serverState').textContent='Checking…';
  try{
    const response=await fetch('/api/connection',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    $('serverLamp').className='lamp on';
    $('serverState').textContent='ONLINE';$('serverState').className='value good';
    $('telegramLamp').className='lamp'+(data.telegramConfigured?' on':'');
    $('telegramState').textContent=data.telegramConfigured?'CONFIGURED':'NOT CONFIGURED';
    $('telegramState').className='value '+(data.telegramConfigured?'good':'warn');
    $('gatewayState').textContent=data.notificationAuthConfigured?'READY':'TOKEN REQUIRED';
    $('gatewayState').className='value '+(data.notificationAuthConfigured?'good':'warn');
    $('message').textContent='เชื่อมต่อเซิร์ฟเวอร์แล้ว · Telegram '+(data.telegramConfigured?'ตั้งค่าแล้ว':'ยังไม่ได้ตั้งค่า Token/Chat ID')+' · ไม่มีระบบ OCR หรือประมวลผลตลาด';
  }catch(error){
    $('serverLamp').className='lamp';$('serverState').textContent='OFFLINE';$('serverState').className='value warn';
    $('telegramState').textContent='UNKNOWN';$('gatewayState').textContent='UNKNOWN';
    $('message').textContent='ไม่สามารถเชื่อมต่อ Server ได้: '+error.message;
  }
}
$('refresh').addEventListener('click',refresh);refresh();
</script>
</body>
</html>
