<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Signal Radar - EUR/USD</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; box-sizing: border-box; }
        h2 { font-size: 18px; text-align: center; color: #58a6ff; margin-top: 0; }
        .subtitle { text-align: center; font-size: 12px; color: #8b949e; margin-bottom: 20px; }
        .status-box { text-align: center; padding: 25px; border-radius: 10px; font-size: 32px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        .CALL { background-color: #238636; color: #fff; }
        .PUT { background-color: #da3633; color: #fff; }
        .STANDBY { background-color: #30363d; color: #8b949e; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        .reason-box { background: #0d1117; padding: 12px; border-radius: 6px; font-size: 13px; color: #8b949e; margin-top: 15px; border-left: 3px solid #58a6ff; }
        .btn { width: 100%; background: #2ea043; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>AI UNIVERSAL SIGNAL RADAR</h2>
    <div class="subtitle">MAIN MARKET — EUR/USD (1M) [1-Candle Cooldown]</div>
    <div id="statusBox" class="status-box STANDBY">STANDBY</div>
    <div class="info-row"><span>Price:</span><strong id="priceVal">Loading...</strong></div>
    <div class="info-row"><span>Regime:</span><strong id="regimeVal">-</strong></div>
    <div class="info-row"><span>Timer:</span><strong id="timerVal">00:00</strong></div>
    <div class="reason-box" id="reasonVal">Initializing system...</div>
    <button class="btn" onclick="enableAudio()">ENABLE AUDIO / VIBRATION</button>
</div>
<script>
    let audioCtx = null;
    function enableAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); alert('Enabled'); }
    function playBeep(freq, dur) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); setTimeout(() => osc.stop(), dur);
        } catch(e){}
    }
    let prevSig = 'STANDBY';
    async function updateRadar() {
        try {
            let res = await fetch('/api/signal'), data = await res.json();
            document.getElementById('priceVal').innerText = data.price || '-';
            document.getElementById('regimeVal').innerText = data.regime || '-';
            document.getElementById('reasonVal').innerText = data.reason || '-';
            let box = document.getElementById('statusBox');
            box.className = `status-box ${data.signal}`; box.innerText = data.signal;
            if (data.signal !== 'STANDBY' && data.signal !== prevSig) { playBeep(880, 300); if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }
            prevSig = data.signal;
        } catch(e){}
    }
    setInterval(() => {
        let rem = 60 - new Date().getSeconds();
        document.getElementById('timerVal').innerText = `00:${rem < 10 ? '0' : ''}${rem}`;
        if(rem === 10) playBeep(440, 150);
        if(rem <= 3 && rem > 0) { playBeep(660, 100); if(navigator.vibrate) navigator.vibrate(100); }
    }, 1000);
    setInterval(updateRadar, 5000);
    updateRadar();
</script>
</body>
</html>
