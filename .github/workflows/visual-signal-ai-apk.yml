name: VISUAL-SIGNAL-AI Android APK
on:
  push:
    branches: [feature/isolated-10ai-engine]
    paths:
      - "isolated-10ai-engine/android/**"
      - ".github/workflows/visual-signal-ai-apk.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build standalone APK
        run: gradle -p isolated-10ai-engine/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VISUAL-SIGNAL-AI-v1.1.0
          path: isolated-10ai-engine/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
