name: Broker Vision Android
on:
  push:
    branches: [feature/universal-broker-vision-android-20261128]
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision.yml'
  pull_request:
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision.yml'
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker-vision/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check server.js
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p broker-vision/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: broker-vision-debug-apk
          path: broker-vision/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
