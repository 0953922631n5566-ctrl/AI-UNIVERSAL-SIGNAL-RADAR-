name: Main Market v2 Rewrite Checks
on:
  push:
    branches: [rewrite/main-market-v2]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  pull_request:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-market/package.json
      - name: Install and run tests
        run: cd main-market && npm install
      - name: Verify direct Android client authentication wiring
        run: |
          cd main-market
          grep -Fq 'const API_ORIGIN=window.location.origin;' public/app.js
          grep -Fq 'ANDROID_CLIENT_TOKEN' server.js
          grep -Fq 'requireDeviceSession' server.js
          grep -Fq 'Access-Control-Allow-Headers' server.js
          grep -Fq 'AndroidBridge' public/app.js
          grep -Fq 'androidClientAuthConfigured' server.js
          grep -Fq 'ORIGINAL_AI' server.js
          grep -Fq 'historicalAnalogueWorker: "BYPASSED"' server.js
          grep -Fq 'export const MIN_CLOSED_CANDLES = 200;' src/config.js
          grep -Fq 'export const HISTORY_CANDLES = 200;' src/config.js
          test ! -e src/telegram-auth.js
          ! grep -Eqi 'Telegram|telegram|initData|BOT_TOKEN' public/app.js server.js public/index.html
      - name: Syntax-check application modules
        run: |
          cd main-market
          node --check server.js
          node --check src/config.js
          node --check src/analyzer.js
          node --check src/twelve-data.js
          node --check src/client-auth.js
          node --check public/app.js
