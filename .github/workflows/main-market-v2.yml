name: Main Market Telegram Mini App Checks
on:
  push:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  pull_request:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-market/package.json
      - name: Install and run tests
        run: cd main-market && npm install
      - name: Verify 50+4 Telegram Mini App wiring
        run: |
          cd main-market
          grep -Fq 'TELEGRAM_BOT_TOKEN' server.js
          grep -Fq 'requireTelegramSession' server.js
          grep -Fq '/api/telegram/session' server.js
          grep -Fq '/api/telegram/signal' server.js
          grep -Fq 'telegram-web-app.js' public/signal.html
          grep -Fq 'export const CONTEXT_CANDLES = 50;' src/config.js
          grep -Fq 'export const ENTRY_CANDLES = 4;' src/config.js
          grep -Fq 'export const MIN_CLOSED_CANDLES = CONTEXT_CANDLES + ENTRY_CANDLES;' src/config.js
          grep -Fq 'export const HISTORY_CANDLES = 100;' src/config.js
          grep -Fq 'decisionEngine: "ENGINE_3_TREND_RIDER_ONLY"' server.js
          grep -Fq 'indicatorEndpoints: ["EMA time_period=5", "EMA time_period=20", "ATR time_period=14"]' server.js
          grep -Fq 'id="manualLampToggle"' public/signal.html
          grep -Fq 'id="trendCard"' public/signal.html
          ! grep -Fq 'sendSignalPush' server.js
          ! grep -Eqi 'sendMessage|sendPhoto|sendDocument' server.js public/signal.html
      - name: Syntax-check application modules
        run: |
          cd main-market
          node --check server.js
          node --check src/config.js
          node --check src/twelve-data.js
          node --check src/trend-rider.js
          node --check src/twelve-data-pool.js
          node --check src/signal-timing.js
          node --check src/stream-retry.js
