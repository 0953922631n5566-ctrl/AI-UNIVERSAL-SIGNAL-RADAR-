name: Main Market Telegram Mini App Checks
on:
  push:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  pull_request:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-market/package.json
      - name: Install and run tests
        run: cd main-market && npm install
      - name: Verify EMA5 two-phase Twelve Data Telegram Mini App wiring
        run: |
          cd main-market
          grep -Fq 'TELEGRAM_BOT_TOKEN' server.js
          grep -Fq 'requireTelegramSession' server.js
          grep -Fq '/api/telegram/session' server.js
          grep -Fq '/api/telegram/ema5/status' server.js
          grep -Fq 'telegram-web-app.js' public/candle-lab.html
          grep -Fq 'EMA5_PULLBACK_TWO_PHASE_M1' server.js
          grep -Fq 'startEma5Sampler' server.js
          grep -Fq 'sampleEma5(feed,"OPEN",minute)' server.js
          grep -Fq 'sampleEma5(feed,"PREPARE",minute)' server.js
          grep -Fq 'enterPreparedSignal(state,minute)' server.js
          grep -Fq 'export const SYMBOLS = Object.freeze(["EUR/USD", "EUR/JPY", "GBP/USD", "USD/JPY"]);' src/config.js
          grep -Fq 'EMA5_PULLBACK_TWO_PHASE_M1' src/ema5-two-phase-engine.js
          grep -Fq 'lastRestKeyNumber' src/twelve-data-pool.js
          grep -Fq 'id="chart"' public/candle-lab.html
          grep -Fq 'id="history"' public/candle-lab.html
          ! grep -Eqi 'GEMINI_API_KEY|analyzeWithGemini|geminiQuotaStatus' server.js public/candle-lab.html
      - name: Syntax-check application modules
        run: |
          cd main-market
          node --check server.js
          node --check src/config.js
          node --check src/twelve-data.js
          node --check src/twelve-data-pool.js
          node --check src/stream-retry.js
          node --check src/ema5-two-phase-engine.js
