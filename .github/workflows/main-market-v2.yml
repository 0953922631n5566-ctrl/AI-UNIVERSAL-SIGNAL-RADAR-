name: Main Market Telegram Mini App Checks
on:
  push:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  pull_request:
    branches: [main-market]
    paths: ["main-market/**", ".github/workflows/main-market-v2.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-market/package.json
      - name: Install and run tests
        run: cd main-market && npm install
      - name: Verify 50+4 Telegram Mini App wiring
        run: |
          cd main-market
          grep -Fq 'TELEGRAM_BOT_TOKEN' server.js
          grep -Fq 'requireTelegramSession' server.js
          grep -Fq '/api/telegram/session' server.js
          grep -Fq '/api/telegram/signal' server.js
          grep -Fq 'telegram-web-app.js' public/signal.html
          grep -Fq 'import { analyzeM5LiveM1Entry } from "./src/m5-live-m1-entry.js";' server.js
          grep -Fq 'M5_LIVE_FORMING' server.js
          grep -Fq 'restFallbackEnabled: false' server.js
          grep -Fq 'lastM5SignalBlock' server.js
          grep -Fq 'TWELVE_DATA_LIVE_STREAM' src/m5-live-m1-entry.js
          grep -Fq 'export const HISTORY_CANDLES = 100;' src/config.js
          grep -Fq 'historicalAnalogueWorker: "BYPASSED"' server.js
          ! grep -Fq 'sendSignalPush' server.js
          ! grep -Eqi 'sendMessage|sendPhoto|sendDocument' server.js public/signal.html
      - name: Syntax-check application modules
        run: |
          cd main-market
          node --check server.js
          node --check src/config.js
          node --check src/analyzer.js
          node --check src/m5-live-m1-entry.js
          node --check src/recovery.js
          node --check src/twelve-data.js
          node --check src/client-auth.js
          node --check src/telegram-auth.js
          node --check public/app.js
          node --check original-ai/engine/multi-engine-dispatcher.js
          node --check original-ai/engine/analyze-market.js
          node --check original-ai/scanner/trend-scanner.js
