name: Broker Vision Android APK Build

on:
  push:
    branches:
      - feature/universal-broker-vision-android-20261128
    paths:
      - "broker-vision/android/**"
      - ".github/workflows/broker-vision-apk.yml"

permissions:
  contents: read

jobs:
  build-broker-vision-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: broker-vision/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s broker-vision/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Generate SHA-256
        run: sha256sum broker-vision/android/app/build/outputs/apk/debug/app-debug.apk > broker-vision/android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: broker-vision-debug-apk
          path: |
            broker-vision/android/app/build/outputs/apk/debug/app-debug.apk
            broker-vision/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
