name: Main Market Node Tests

on:
  pull_request:
    branches: [main-market]
    paths:
      - 'main-market/**'
      - '.github/workflows/main-market-tests.yml'
  push:
    branches: [main-market, 'feature/v1-bb-cooperative-analysis']
    paths:
      - 'main-market/**'
      - '.github/workflows/main-market-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main-market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-market/package-lock.json
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check src/bb-pure-scalper.js
