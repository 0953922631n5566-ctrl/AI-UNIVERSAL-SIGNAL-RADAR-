name: Node Forecast Tests

on:
  push:
    branches: [main, 'feat/main-market-apk-background-fcm']
    paths:
      - 'forecast-engine.js'
      - 'live-engine.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/node-tests.yml'
  pull_request:
    paths:
      - 'forecast-engine.js'
      - 'live-engine.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/node-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --test test/forecast-engine.test.js
