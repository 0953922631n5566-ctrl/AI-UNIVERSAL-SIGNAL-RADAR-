name: Node.js Tests

on:
  push:
    branches:
      - feature/future-simulation-engine
  pull_request:
    branches:
      - feature/future-simulation-engine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run complete test suite
        run: npm test
