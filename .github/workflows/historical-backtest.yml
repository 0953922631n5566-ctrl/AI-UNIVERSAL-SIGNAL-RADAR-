name: Historical EURUSD Backtest

on:
  push:
    branches:
      - feature/future-simulation-engine
  workflow_dispatch:
    inputs:
      from:
        description: "UTC start date YYYY-MM-DD (leave blank for default 30-day window)"
        required: false
        type: string
      to:
        description: "UTC end date YYYY-MM-DD (leave blank for default 30-day window)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HISTORICAL_MIN_COVERAGE_PCT: "50"
      HISTORICAL_MIN_TICKS: "100"
      HISTORICAL_MIN_M1_CANDLES: "202"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Download historical EURUSD ticks (skip failed hours)
        env:
          FROM_DATE: ${{ inputs.from }}
          TO_DATE: ${{ inputs.to }}
        run: |
          if [ -n "$FROM_DATE" ] && [ -n "$TO_DATE" ]; then
            npm run data:download -- --from "$FROM_DATE" --to "$TO_DATE"
          elif [ -z "$FROM_DATE" ] && [ -z "$TO_DATE" ]; then
            npm run data:download
          else
            echo "Provide both from and to dates, or leave both blank."
            exit 2
          fi
      - name: Decode available ticks, aggregate M1 and enforce coverage
        run: npm run data:decode
      - name: Run tick-level 10s, 20s and 30s backtests
        run: npm run backtest:ticks
      - name: Run M1 diagnostic backtest
        run: npm run backtest:m1 -- data/historical/EURUSD_M1.csv data/historical/reports/m1-backtest-report.json
      - name: Upload manifest, decoded data and backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-historical-backtest
          path: |
            data/historical/download-manifest.json
            data/historical/EURUSD_ticks.csv
            data/historical/EURUSD_M1.csv
            data/historical/reports/*.json
          if-no-files-found: error
          retention-days: 14
