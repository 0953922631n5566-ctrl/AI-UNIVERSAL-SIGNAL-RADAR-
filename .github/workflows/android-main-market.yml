name: Signal Radar PRO v1.11.0 Build 16 Main Market APK

on:
  workflow_dispatch:
  push:
    branches: [main-market]
    paths:
      - "main-market/android/**"
      - ".github/workflows/android-main-market.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Main Market debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main-market branch
        uses: actions/checkout@v4
        with:
          ref: main-market

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: main-market/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -s main-market/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose main-market/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Generate SHA-256
        run: sha256sum main-market/android/app/build/outputs/apk/debug/app-debug.apk > main-market/android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-radar-pro-v1.11.0-build-16-debug-signed-apk
          path: |
            main-market/android/app/build/outputs/apk/debug/app-debug.apk
            main-market/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
