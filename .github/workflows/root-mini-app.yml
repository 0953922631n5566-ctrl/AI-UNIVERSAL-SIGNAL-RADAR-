name: Root Mini App Checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/root-mini-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/root-mini-app.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the single-file Mini App
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const html = fs.readFileSync('index.html', 'utf8');
          const inlineScripts = html.split('<script').slice(1)
            .filter(part => !part.slice(0, 200).includes('src='))
            .map(part => part.slice(part.indexOf('>') + 1, part.indexOf('</script>')))
            .filter(source => source.trim());

          assert.ok(inlineScripts.length > 0, 'index.html must contain an inline JavaScript application');
          for (const [index, source] of inlineScripts.entries()) {
            new Function(source);
            console.log(`Inline script ${index + 1}: syntax OK`);
          }

          for (const id of ['pairSelect', 'start', 'stop', 'testSound', 'testVibration']) {
            assert.ok(html.includes(`id="${id}"`), `Missing required control: ${id}`);
          }

          for (const pair of ['EUR/USD', 'AUD/USD', 'EUR/GBP', 'GBP/JPY', 'EUR/JPY', 'GBP/USD']) {
            assert.ok(html.includes(pair), `Missing supported pair: ${pair}`);
          }

          assert.ok(html.includes('https://ai-signal-radar-main-market.onrender.com'));
          assert.ok(html.includes('/api/auth') && html.includes('/api/state') && html.includes('/api/control'));
          assert.ok(!fs.existsSync('app.js'), 'Root app.js must not be required by the single-file app');
          assert.ok(!fs.existsSync('styles.css'), 'Root styles.css must not be required by the single-file app');
          assert.ok(!html.includes('TWELVE_API_KEY = "demo"'), 'Demo API key is not allowed');
          assert.ok(!html.includes('Math.random()'), 'Randomly simulated market data/signals are not allowed');

          console.log('Single-file Mini App checks passed.');
          NODE
