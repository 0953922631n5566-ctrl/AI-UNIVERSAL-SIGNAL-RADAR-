name: Root Mini App Checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/root-mini-app.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/root-mini-app.yml"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify Mini App controls and API wiring
        run: |
          grep -q 'id="openPairModal"' index.html
          grep -q 'id="start"' index.html
          grep -q 'id="stop"' index.html
          grep -q 'id="testSound"' index.html
          grep -q 'id="testVibration"' index.html
          grep -Fq 'const idle = !monitoring && state.serverOnline;' app.js
          grep -Fq 'idle ? "● SERVER ONLINE" :' app.js
          grep -Fq 'fetch(API_ORIGIN + "/api/control"' app.js
          grep -Fq 'fetch(API_ORIGIN + "/api/state"' app.js
          grep -Fq 'new WebSocket(protocol + "//" + new URL(API_ORIGIN).host + "/live")' app.js

          grep -Fq 'return PAIRS.includes(value) ? value : "EUR/USD";' app.js
