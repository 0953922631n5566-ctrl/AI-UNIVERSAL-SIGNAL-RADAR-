name: Main Market Live Engine 3 Smoke Test

on:
  push:
    branches: [main-market]
    paths:
      - "main-market/server.js"
      - "main-market/public/signal.html"
      - "main-market/src/**"
      - ".github/workflows/main-market-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the Engine 3 Render release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          HEALTH=""
          READY=0
          for attempt in $(seq 1 60); do
            if HEALTH="$(curl -fsS --max-time 12 "$BASE/health" 2>/dev/null)" && printf '%s' "$HEALTH" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { const h=JSON.parse(s); process.exit(h.ok && h.architecture?.decisionEngine==="ENGINE_3_TREND_RIDER_ONLY" && h.architecture?.engines===1 && h.architecture?.controlChannel==="TELEGRAM_MINI_APP_HTTP_POLLING_START_STOP" ? 0 : 1); }
                catch { process.exit(1); }
              });'; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1" || { echo "Render did not become healthy on the expected Engine 3 release"; exit 1; }

      - name: Verify Mini App and exercise session start stop
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          HTML="$(curl -fsS --max-time 20 "$BASE/signal")"
          printf '%s' "$HTML" | grep -q 'id="monitorToggle"'
          printf '%s' "$HTML" | grep -q 'id="trendCard"'
          printf '%s' "$HTML" | grep -q 'id="manualLampToggle"'

          SESSION="$(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/api/telegram/session")"
          TOKEN="$(printf '%s' "$SESSION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sessionToken||""));')"
          test -n "$TOKEN"
          cleanup() {
            curl -fsS --max-time 15 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"stop"}' "$BASE/api/telegram/control" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          BEFORE="$(curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/telegram/signal")"
          printf '%s' "$BEFORE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok)process.exit(1);});'

          STARTED="$(curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"start"}' "$BASE/api/telegram/control")"
          printf '%s' "$STARTED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.market?.monitoring!==true)process.exit(1);});'

          LIVE=0
          for attempt in $(seq 1 36); do
            STATE="$(curl -fsS --max-time 20 "$BASE/api/public/signal")"
            if printf '%s' "$STATE" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try {
                  const m=JSON.parse(s).market;
                  const ok=m?.monitoring===true && m?.apiStatus==="ONLINE" && m?.indicators?.status==="READY" &&
                    m?.indicators?.ema5 && m?.indicators?.ema20 && m?.indicators?.atr14;
                  process.exit(ok ? 0 : 1);
                } catch { process.exit(1); }
              });'; then
              LIVE=1
              break
            fi
            sleep 5
          done
          test "$LIVE" = "1" || { echo "Engine 3 did not reach live Streaming plus native EMA5/EMA20/ATR14 readiness"; exit 1; }

          STOPPED="$(curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"stop"}' "$BASE/api/telegram/control")"
          printf '%s' "$STOPPED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.market?.monitoring!==false)process.exit(1);});'
          trap - EXIT
          echo "PASS: Mini App session, Start, live Streaming, Twelve Data EMA5/EMA20/ATR14, and Stop."
