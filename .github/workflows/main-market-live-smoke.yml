name: Universal Broker Vision Mini App Smoke Test

on:
  push:
    branches: [main-market]
    paths:
      - "main-market/server.js"
      - "main-market/public/vision-signal.html"
      - ".github/workflows/main-market-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the current Main Market release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          READY=0
          for attempt in $(seq 1 24); do
            if HEALTH="$(curl -fsS --max-time 12 "$BASE/health" 2>/dev/null)" && printf '%s' "$HEALTH" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { const h=JSON.parse(s); process.exit(h.ok && h.service==="main-market" ? 0 : 1); }
                catch { process.exit(1); }
              });'; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1" || { echo "Main Market service did not become healthy"; exit 1; }

      - name: Verify APK-derived candlestick Mini App and live API proxy
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          HTML="$(curl -fsS --max-time 20 "$BASE/signal")"
          printf '%s' "$HTML" | grep -q 'UNIVERSAL BROKER VISION'
          printf '%s' "$HTML" | grep -q 'id="priceChart"'
          printf '%s' "$HTML" | grep -q 'LIVE M1 CANDLES'
          printf '%s' "$HTML" | grep -q 'drawPriceChart'

          STATE="$(curl -fsS --max-time 20 "$BASE/api/vision/miniapp")"
          printf '%s' "$STATE" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try {
                const x=JSON.parse(s);
                if(!x.ok || x.connected!==true || x.chartSource!=="APK_CAPTURED_PRICE_OHLC" ||
                   !Array.isArray(x.priceCandles) || !x.analysis || !x.analysis.nextCandlePrediction) process.exit(1);
              } catch { process.exit(1); }
            });'
          echo "PASS: Vision Mini App serves a canvas chart and the proxy returns APK-derived M1 OHLC candles."
