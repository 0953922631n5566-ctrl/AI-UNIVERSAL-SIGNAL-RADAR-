name: Main Market Candle Lab Smoke Test

on:
  push:
    branches: [main-market]
    paths:
      - "main-market/server.js"
      - "main-market/public/signal-next.html"
      - "main-market/public/candle-lab.html"
      - "main-market/src/**"
      - ".github/workflows/main-market-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the current Main Market release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          READY=0
          for attempt in $(seq 1 24); do
            if HEALTH="$(curl -fsS --max-time 12 "$BASE/health" 2>/dev/null)" && printf '%s' "$HEALTH" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try {
                  const h=JSON.parse(s);
                  const lab=h.architecture?.candlePatternLab;
                  process.exit(h.ok && h.service==="main-market" && h.symbols?.includes("EUR/USD") &&
                    h.interval==="1min" && lab?.route==="/candle-lab" &&
                    lab?.defaultHistoryCandles===200000 ? 0 : 1);
                } catch { process.exit(1); }
              });'; then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1" || { echo "Current Main Market release did not expose the Candle Pattern Lab architecture"; exit 1; }

      - name: Verify Mini Apps, session, prediction API, and learning status
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ai-signal-radar-main-market.onrender.com"
          SIGNAL_HTML="$(curl -fsS --max-time 20 "$BASE/signal")"
          printf '%s' "$SIGNAL_HTML" | grep -q 'SIGNAL RADAR'
          printf '%s' "$SIGNAL_HTML" | grep -q 'id="orb"'
          LAB_HTML="$(curl -fsS --max-time 20 "$BASE/candle-lab")"
          printf '%s' "$LAB_HTML" | grep -q 'CANDLE PATTERN LAB'
          printf '%s' "$LAB_HTML" | grep -q '200,000'

          SESSION="$(curl -fsS --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/api/telegram/session")"
          TOKEN="$(printf '%s' "$SESSION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sessionToken||""));')"
          test -n "$TOKEN"
          cleanup() {
            curl -fsS --max-time 15 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"stop"}' "$BASE/api/telegram/control" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          STATUS="$(curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/telegram/candle-learning/status")"
          printf '%s' "$STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.learning?.targetCandles!==200000)process.exit(1);});'

          STARTED="$(curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"start"}' "$BASE/api/telegram/control")"
          printf '%s' "$STARTED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.market?.monitoring!==true)process.exit(1);});'

          NEXT="$(curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/telegram/signal-next")"
          printf '%s' "$NEXT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.market?.symbol!=="EUR/USD")process.exit(1);});'

          STOPPED="$(curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"action":"stop"}' "$BASE/api/telegram/control")"
          printf '%s' "$STOPPED" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.ok||x.market?.monitoring!==false)process.exit(1);});'
          trap - EXIT
          echo "PASS: current signal Mini App, Candle Pattern Lab page/API, session, Start, next-signal API, and Stop."
