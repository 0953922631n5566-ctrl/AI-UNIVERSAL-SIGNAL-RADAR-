name: OTC Vision APK CI

on:
  push:
    branches:
      - feature/otc-vision-apk
    paths:
      - "otc-vision/**"
      - ".github/workflows/otc-vision-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated OTC Vision branch
        uses: actions/checkout@v4
        with:
          ref: feature/otc-vision-apk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and assemble APK
        working-directory: otc-vision
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK
        run: |
          test -s otc-vision/app/build/outputs/apk/debug/app-debug.apk
          sha256sum otc-vision/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK and unit test reports
        uses: actions/upload-artifact@v4
        with:
          name: otc-vision-finetuned-debug-apk
          path: |
            otc-vision/app/build/outputs/apk/debug/app-debug.apk
            otc-vision/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
