name: Android APK Build
on:
  push:
    branches: [main-market]
    paths:
      - "main-market/android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main-market]
    paths:
      - "main-market/android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p main-market/android assembleDebug
      - name: Verify APK and SHA-256
        run: |
          APK="main-market/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee main-market/android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Signal-Radar-PRO-v1.11.0-APK
          path: |
            main-market/android/app/build/outputs/apk/debug/app-debug.apk
            main-market/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
