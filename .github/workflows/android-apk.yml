name: Android APK Build
on:
  push:
    branches: [main-market, feat/android-background-alerts]
    paths: ["main-market/android/**", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main-market]
    paths: ["main-market/android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p main-market/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kawasaki-Signal-Radar-APK
          path: main-market/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
