name: Broker Vision CI

on:
  push:
    branches: [fix/broker-vision-e2e-20261128]
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision-ci.yml'
  pull_request:
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision-ci.yml'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker-vision/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle -p broker-vision/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: universal-broker-vision-debug-apk
          path: broker-vision/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
