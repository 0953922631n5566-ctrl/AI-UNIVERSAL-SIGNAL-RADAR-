name: Broker Vision CI
# Run API regression tests and verify the Android capture app on every feature-branch update.

on:
  push:
    branches: [feature/universal-broker-vision-android-20261128]
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision-ci.yml'
  pull_request:
    paths:
      - 'broker-vision/**'
      - '.github/workflows/broker-vision-ci.yml'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker-vision/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  android-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p broker-vision/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: universal-broker-vision-debug-apk
          path: broker-vision/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
