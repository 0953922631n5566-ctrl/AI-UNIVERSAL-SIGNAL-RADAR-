name: OTC Vision Android Build

on:
  push:
    branches: [feature/otc-vision-apk]
    paths:
      - "otc-vision/**"
      - ".github/workflows/otc-vision-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-otc-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/otc-vision-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Assemble isolated OTC debug APK
        working-directory: otc-vision
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and checksum
        run: |
          test -s otc-vision/app/build/outputs/apk/debug/app-debug.apk
          sha256sum otc-vision/app/build/outputs/apk/debug/app-debug.apk > otc-vision/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: otc-vision-radar-debug-apk
          path: |
            otc-vision/app/build/outputs/apk/debug/app-debug.apk
            otc-vision/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
