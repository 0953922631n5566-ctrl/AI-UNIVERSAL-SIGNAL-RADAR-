name: Main Market Recovery Tests

on:
  push:
    branches:
      - feature/independent-engine-recovery
  pull_request:
    branches:
      - main-market

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and run package checks
        working-directory: main-market
        run: npm install
      - name: Run recovery and project tests
        working-directory: main-market
        run: npm test
      - name: Syntax-check server and client
        working-directory: main-market
        run: |
          node --check server.js
          node --check public/app.js
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("public/signal.html","utf8"); const start=html.indexOf("<script>")+8; const end=html.lastIndexOf("</script>"); if(start<8||end<=start) throw new Error("No inline script found"); new Function(html.slice(start,end)); console.log("Mini App inline JavaScript syntax OK")'
