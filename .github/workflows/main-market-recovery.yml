name: Main Market Recovery Tests

on:
  push:
    branches:
      - feature/independent-engine-recovery
  pull_request:
    branches:
      - main-market

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and run package checks
        working-directory: main-market
        run: npm install
      - name: Run recovery and project tests
        working-directory: main-market
        run: npm test
      - name: Syntax-check server and client
        working-directory: main-market
        run: |
          node --check server.js
          node --check public/app.js
          node --check src/recovery.js
          node --check public/signal.html
