name: Fast Signal A tests
on:
  push:
    branches:
      - experiment/fast-signal-a
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --test experimental/fast-signal.test.js
