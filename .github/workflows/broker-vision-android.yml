name: Broker Vision Android APK Build

on:
  push:
    branches:
      - feature/floating-price-roi-20261128
  pull_request:
    branches:
      - feature/universal-broker-vision-android-20261128
    paths:
      - "broker-vision/android/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p broker-vision/android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-broker-vision-debug
          path: broker-vision/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
