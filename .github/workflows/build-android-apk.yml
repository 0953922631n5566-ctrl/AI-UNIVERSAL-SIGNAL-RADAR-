name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/server-price-extraction
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          OCR_API_TOKEN: ${{ secrets.OCR_API_TOKEN }}
        run: |
          test -n "$BACKEND_URL" || { echo "Missing BACKEND_URL repository secret"; exit 1; }
          test -n "$OCR_API_TOKEN" || { echo "Missing OCR_API_TOKEN repository secret"; exit 1; }
          case "$BACKEND_URL" in https://*) ;; *) echo "BACKEND_URL must use HTTPS"; exit 1 ;; esac
          gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-signal-radar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
