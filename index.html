<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e0b">
  <meta name="robots" content="noindex,nofollow">
  <title>AI Signal Radar · Main Market</title>
  <style>
    :root{color-scheme:dark;background:#090e0b;color:#f0f5f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#1c3525 0,transparent 55%),#090e0b}
    main{width:min(100%,420px);padding:26px;border:1px solid #29382e;border-radius:22px;background:#111a14;text-align:center;box-shadow:0 18px 50px #0008}
    .mark{font-size:38px;color:#43df8b}h1{font-size:20px;margin:8px 0}p{color:#a8b8ad;font-size:13px;line-height:1.6}
    .status{display:inline-block;padding:7px 12px;border:1px solid #6c5934;border-radius:30px;color:#f2ca7b;font-size:11px}
    button,a{display:block;width:100%;margin-top:12px;padding:13px 16px;border:0;border-radius:11px;background:#43df8b;color:#082012;font-weight:700;text-decoration:none;font-size:14px}
    a.secondary{background:#27332b;color:#e2e9e3;border:1px solid #435146}
  </style>
  <script>
    (() => {
      "use strict";
      const APP_URL = "https://ai-signal-radar-main-market.onrender.com/";
      const go = () => { try { window.location.replace(APP_URL); } catch (_) { window.location.href = APP_URL; } };
      window.addEventListener("DOMContentLoaded", () => {
        const open = document.getElementById("openApp");
        const retry = document.getElementById("retry");
        if (open) open.addEventListener("click", go);
        if (retry) retry.addEventListener("click", go);
        window.setTimeout(go, 350);
      });
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◈</div>
    <h1>AI UNIVERSAL SIGNAL RADAR</h1>
    <p>กำลังเปิดระบบ Main Market · NON-OTC<br>เลือกคู่เงินและควบคุมการสแกนได้ในหน้าระบบหลัก</p>
    <span class="status" role="status" aria-live="polite">กำลังเชื่อมต่อระบบหลัก…</span>
    <button id="openApp" type="button">เปิด Main Market</button>
    <a class="secondary" id="retry" href="https://ai-signal-radar-main-market.onrender.com/">เปิดระบบหลักโดยตรง</a>
    <noscript><p>กรุณาเปิด JavaScript หรือแตะปุ่มเปิดระบบหลักด้านบน</p></noscript>
  </main>
</body>
</html>
