<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>Signal Radar · Main Market</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07110d;color:#edf7f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#123322,#07110d 60%)}main{width:min(100%,520px);border:1px solid #24523a;border-radius:22px;background:#0b1711;padding:22px}header{display:flex;justify-content:space-between;color:#9eb9a8;font-size:12px}h1{font-size:18px;margin:16px 0}#signal{font-size:clamp(48px,14vw,76px);font-weight:900;text-align:center;margin:20px 0 4px;color:#aab5ae}#signal.CALL{color:#43e58b}#signal.PUT{color:#ff646b}#pair,#price{text-align:center}#price{font-size:30px;margin:12px}.panel{border:1px solid #203e2d;background:#0e2117;border-radius:14px;padding:14px;margin-top:12px}.label{font-size:11px;color:#91ad9b}.value{margin-top:5px;line-height:1.5;overflow-wrap:anywhere}footer{color:#779382;font-size:11px;text-align:center;margin-top:16px}
</style></head><body><main><header><span>AI UNIVERSAL SIGNAL RADAR</span><span id="api">CONNECTING</span></header><h1>MAIN MARKET · LIVE</h1><div id="pair">EUR/USD · M1</div><div id="signal">STANDBY</div><div id="price">—</div><section class="panel"><div class="label">MARKET REGIME</div><div class="value" id="regime">กำลังรอข้อมูล</div></section><section class="panel"><div class="label">AI REASONING</div><div class="value" id="reason">กำลังเชื่อมต่อระบบ</div></section><section class="panel"><div class="label">DATA STATUS</div><div class="value" id="data">กำลังตรวจสอบข้อมูลตลาด</div></section><footer id="updated">อัปเดตอัตโนมัติทุก 3 วินาที · ไม่ส่งคำสั่งซื้อขาย</footer></main>
<script>
const el=id=>document.getElementById(id);const fmt=v=>v==null||!Number.isFinite(Number(v))?"—":Number(v).toFixed(5);
async function refresh(){try{const r=await fetch("/api/public/signal",{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const p=await r.json();const m=p.market||p;const s=["CALL","PUT","STANDBY"].includes(m.signal)?m.signal:"STANDBY";el("pair").textContent=(m.symbol||"EUR/USD")+" · M1";el("signal").textContent=s;el("signal").className=s;el("price").textContent=fmt(m.price);el("regime").textContent=m.regime||"UNCLEAR";el("reason").textContent=m.reason||"ยังไม่มีเหตุผลจากตัววิเคราะห์";el("api").textContent=m.apiStatus||"UNKNOWN";el("data").textContent=[m.statusMessage||"—","แท่งปิด "+(m.closedCandleCount??0)+"/"+(m.requiredCandles??"—"),"ข้อมูล "+(m.ageSeconds==null?"—":Math.round(m.ageSeconds)+" วินาที"),"Release "+(m.signalReleaseStatus||"—")].join(" · ");el("updated").textContent="อัปเดต "+new Date(p.updatedAt||m.analyzedAt||Date.now()).toLocaleTimeString("th-TH")+" · อ่านอย่างเดียว";}catch(e){el("api").textContent="ERROR";el("reason").textContent="เชื่อมต่อไม่สำเร็จ: "+e.message;}}refresh();setInterval(refresh,3000);
</script></body></html>
