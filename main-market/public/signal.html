<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main Market Signal</title></head><body><main><h1>MAIN MARKET · EUR/USD M1</h1><strong id="signal">STANDBY</strong><p id="price">—</p><p id="reason">กำลังเชื่อมต่อ</p><p id="status">—</p></main><script>async function poll(){try{const r=await fetch('/api/public/signal',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json(),m=p.market||p;document.getElementById('signal').textContent=['CALL','PUT','STANDBY'].includes(m.signal)?m.signal:'STANDBY';document.getElementById('price').textContent=m.price??'—';document.getElementById('reason').textContent=m.reason||'—';document.getElementById('status').textContent=[m.apiStatus,m.regime,m.statusMessage].filter(Boolean).join(' · ')}catch(e){document.getElementById('status').textContent=e.message}}poll();setInterval(poll,3000)</script></body></html>
